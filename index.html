<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>유에클 공감 문장</title>
<style>
/* @hfk-base:start */
/* HFK 아티팩트 기본 규칙: 고정 3종(폰트·자간·여백)만 담는다.
   색·레이아웃·타입스케일은 문서마다 다르게 잡되, 아래 세 가지는 바꾸지 않는다.
   1) 폰트는 Pretendard  2) 자간 -0.02em  3) 문단 여백 = 페이지 여백 (--space 하나로 묶음) */
:root {
  --space: 40px;          /* 페이지 상하좌우 padding 이자 문단 사이 간격. 두 값은 항상 같다 */
  --ink: #2d2523;         /* HFK Charcoal */
  --paper: #f0eae2;       /* HFK White */
  --line: #ddcfbf;
  --muted: #441a15;       /* HFK Burgundy — 밝은 배경 보조 텍스트 */
  --hfk-red: #980000;     /* 13~15px 라벨·인라인 강조 전용. 18px 이상 제목에 쓰지 않는다 */
  --coral: #ff6154;       /* CTA */
}
@media (max-width: 640px) { :root { --space: 24px; } }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #f0eae2; --paper: #2d2523; --line: #4a3f3c; --muted: #ceb9a4;
  }
}
:root[data-theme="dark"] {
  --ink: #f0eae2; --paper: #2d2523; --line: #4a3f3c; --muted: #ceb9a4;
}

html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: var(--space);
  background: var(--paper);
  color: var(--ink);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  font-size: 16px;
  line-height: 1.8;
  letter-spacing: -0.02em;   /* 자간 -20 */
  font-feature-settings: 'tnum' 0;
}
h1, h2, h3, h4, h5, h6, p, ul, ol, dl, blockquote, table, figure, pre, hr { margin: 0; }
h1, h2, h3, h4, h5, h6 { line-height: 1.35; letter-spacing: -0.02em; font-weight: 700; }

/* 블록 사이 간격 = 페이지 여백. 첫 블록만 예외(위 여백은 body padding 이 담당) */
* + p, * + h1, * + h2, * + h3, * + h4, * + ul, * + ol, * + dl,
* + blockquote, * + table, * + figure, * + pre, * + hr, * + section {
  margin-top: var(--space);
}
li + li { margin-top: calc(var(--space) / 5); }
hr { border: 0; border-top: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; }
.scroll-x { overflow-x: auto; }   /* 넓은 표·코드는 이 안에 넣는다. body 는 가로 스크롤 금지 */

  <p data-title="어떤 문장들" data-month="10월">자기의 지하실을, 가오를 지키기 위해 백조처럼 발을 구르던 선배에게 가닿은 그 편지는, 그 문장은 그렇게 힘이 세져 살아있었구나.</p>
  <p data-title="어떤 문장들" data-month="10월">날이 좋던 6월의 어느 일요일 저녁 선배는 두둑한 축의금을 들고 아는 사람은 누구도 없는 자리에 식이 끝나기까지 끝까지 자리를 지켰다. 그 마음이 선배식의 가오, 선배만의 지하실이었다.</p>
  <p data-title="어떤 문장들" data-month="10월">아, 내가 쥐고 있던 문장은 편지로 가닿아 선배에게 아직도 살아 이렇게 나에게 되돌아왔구나.</p>
  <p data-title="등가교환" data-month="10월">아니, 그거 편지 아니라고.</p>
  <p data-title="등가교환" data-month="10월">딱 그만큼의 간극이 감동 혹은 서운함이 되겠지</p>
  <p data-title="등가교환" data-month="10월">편지 한 장의 마음값이 대체 얼마이길래</p>
  <p data-title="인생편지" data-month="10월">시간의 공백 사이에 일어나는 일들이 있거든요</p>
  <p data-title="인생편지" data-month="10월">편지를 보내는 사람도 받는 사람도 어쩔 수 없는 시간의 공백 속으로 들어간다.</p>
  <p data-title="인생편지" data-month="10월">나도 그런 것을 써본 적이 있다. 정확히 말하면 ‘연애 호소’ 편지다.</p>
  <p data-title="편지 종말론" data-month="10월">그러함에도 나는 아직 편지가 더 좋다!</p>
  <p data-title="편지 종말론" data-month="10월">연말 편지 쓰는 모임</p>
  <p data-title="편지 종말론" data-month="10월">일단 편지는 종합예술 같다.</p>
  <p data-title="편지 종말론" data-month="10월">글씨 또한 단순히 메신저로 주고받는 ‘맑은 고딕’이 아니다!</p>
  <p data-title="편지 종말론" data-month="10월">편지는 점점 고-급 선물이 되지 않을까</p>
  <p data-title="담(淡)" data-month="10월">편지를 쓰면 그동안 언닐 떠올리면서 했던 생각을 적느라 내용이 많을 줄 알았는데 막상 쓰니 언니 한번 쓰담아주고 싶다</p>
  <p data-title="담(淡)" data-month="10월">사랑을 이해하는 마음은 어린 것이 없다.</p>
  <p data-title="담(淡)" data-month="10월">뒤늦게야 담백해진 사랑</p>
  <p data-title="부치지 못한 편지" data-month="10월">너와 내가 사랑하다 헤어진 것도 아닌데 왜 네 생각이 났는지 모르겠어.</p>
  <p data-title="부치지 못한 편지" data-month="10월">너와의 추억은 기억되는 것보다 소멸되는 게 더 많아져서인가 봐.</p>
  <p data-title="부치지 못한 편지" data-month="10월">스티커 사진 잉크가 자꾸 뭉개져서 네 눈코입이 흐려지고 있고, 그만큼 기억도 소멸되어 남은 게 몇 가지 없어</p>
  <p data-title="목소리로 전하는 마지막 편지" data-month="10월">그닥 정이 없다고 하면서 사람들이 할아버지에게 한마디씩 하는 말들을 듣다가 혼자 오열을 겨우 참고 눈물을 줄줄 흘리고 있었기 때문이다.</p>
  <p data-title="목소리로 전하는 마지막 편지" data-month="10월">세상에 엄마를 보내줘서 고마웠어요. 안녕, 할아버지.</p>
  <p data-title="목소리로 전하는 마지막 편지" data-month="10월">60년 일찍 떠난 아내와 10년 일찍 떠난 두 번째 아내까지 다시 만나 속없이 또 자기 이야기만 늘어놓겠지</p>
  <p data-title="손절편지" data-month="10월">이 편지가 너에게 닿을 일은 없을 테지만, 그래도 너에게 편지를 써.</p>
  <p data-title="손절편지" data-month="10월">앞으로 너의 소식을 들을 일은 없겠지만 어디서든 잘 살길 바랄게. 안녕!</p>
  <p data-title="편지와 쪽지" data-month="10월">할 말이 어찌 많은지 수업 시간엔 쪽지를, 집에 돌아와서는 편지를 써서 학교에서 주곤 했다.</p>
  <p data-title="편지와 쪽지" data-month="10월">얼마나 편지를 쓸 일이 많았는지 100장짜리 편지지 묶음 노트가 있었다.</p>
  <p data-title="편지와 쪽지" data-month="10월">짧지만 문장에 나와 수신자의 마음이 흘러 들어갈 공간을 남기도록 고심한다.</p>
  <p data-title="편지와 쪽지" data-month="10월">예쁜 편지지를 아끼던 때와 달리 이번 쪽지 묶음은 다 쓰면 좋겠다.</p>
  <p data-title="손편지좋아맨" data-month="10월">그때 발신인의 진심이 거리감의 반비례함 정도만큼 느껴진다고나 할까.</p>
  <p data-title="손편지좋아맨" data-month="10월">글자 행이 수평이었다가 5도 정도 우상향 또는 우하향하다가 다시 수평으로 돌아오는 것도 귀엽다.</p>
  <p data-title="손편지좋아맨" data-month="10월">새로운 카드를 꺼내 다시 써 내려간 경험이 나는 매우 많다</p>
  <p data-title="편지는 자기 고백의 일기장" data-month="10월">그래서 나는 양으로 승부해보려고 한다.</p>
  <p data-title="편지는 자기 고백의 일기장" data-month="10월">편지를 받을 때 그 안에 적힌 내용도 물론 너무 좋지만, 그냥 편지를 받고 그 사람이 나를 위해 이렇게 시간을 낸 것이 너무나 고맙고 기쁘다.</p>
  <p data-title="급속 충전" data-month="10월">받는 사람에게도 그 선물에 담긴 그 시간을 읽어내는 다정한 시선이 필요하다.</p>
  <p data-title="급속 충전" data-month="10월">편지에는 사랑만 쓰이는 건 아니다.</p>
  <p data-title="급속 충전" data-month="10월">영국에서 시작되어 나흘 안에 일곱 명에게 똑같은 편지를 보내야 불운을 막을 수 있다던 그 행운의 편지도 결국 장문의 편지를 베껴 쓰는 그 시간만큼의 정성이 저주를 푸는 비결은 아니었을까?</p>
  <p data-title="다인에게" data-month="10월">지금은 전력으로 다인이의 엄마로 살아가고 있지만, 너의 엄마가 되기 전의 언니를 나는 알고 있어</p>
  <p data-title="다인에게" data-month="10월">우리가 서로에게 무관심한 적은 한 번도 없었다?</p>
  <p data-title="다인에게" data-month="10월">언니가 좋아하는 것들을 하나라도 놓칠세라, 그때부터 나는 밤에 늦게 자기를 좋아하는 사람이 된 것 같아.</p>
  <p data-title="다인에게" data-month="10월">이 세상에서 나를 제대로 이해하는 존재는 언니밖에 없다는 생각에 더 그랬던 것 같아. 하지만, 인간은 스스로도 제대로 이해할 수 없단다. 갑자기 허무한 결론을 내서 미안해.</p>
  <p data-title="낭만가 기질" data-month="11월">선택적 낭만가</p>
  <p data-title="낭만가 기질" data-month="11월">평일 저녁을 먹은 후 아빠의 루틴은 내 연필을 깎는 일이었다.</p>
  <p data-title="낭만가 기질" data-month="11월">곤히 잠든 딸의 머리맡에서 등교하는 딸을 위해 사각사각 연필을 손수 매일 깎는 아버지의 모습이라니.</p>
  <p data-title="낭만가 기질" data-month="11월">손수 연필을 깎는 시간을 낭만적이라고 생각하게 했던 아빠의 시간, 빨리보다 손수에 더 감동받는 사람이 된 이유.</p>
  <p data-title="나를 잘 대접하기" data-month="11월">야채를 하나하나 얇게 썰어 프라이팬에 굽고 있던 무카는 내가 사 온 토마토도 썰어서 팬에 올렸다.</p>
  <p data-title="나를 잘 대접하기" data-month="11월">딱히 하는 것 없이 뒹굴거리며 점심으론 라따뚜이를, 저녁으론 카레까지 얻어먹고 느지막이 집으로 돌아왔다.</p>
  <p data-title="나를 잘 대접하기" data-month="11월">기왕이면 내가 애써서 나를 잘 먹이기</p>
  <p data-title="나를 잘 대접하기" data-month="11월">그리고 지금, 나는 결국 냉동만두를 꺼내 몇 개를 렌지에 넣고 돌리기 시작했다.</p>
  <p data-title="나의 붕어빵일지" data-month="11월">이 무슨 운명인지!</p>
  <p data-title="나의 붕어빵일지" data-month="11월">당근에서 5천원 주고 산 붕어빵모양 발매트와 박스를 북북 찢어 매직으로 손수 적은 메뉴판을 이곳저곳 붙여 놓으면 세팅 완료.</p>
  <p data-title="나의 붕어빵일지" data-month="11월">아무래도 붕어빵을 깎아내리려는 잉어빵 관계자가 뿌린 게 분명하다.</p>
  <p data-title="나의 붕어빵일지" data-month="11월">결론은 “가스“로 구운 “붕어빵“이 핵심이다.</p>
  <p data-title="나의 붕어빵일지" data-month="11월">가짜 붕어 팔아서 진짜 고급 생선 먹기.</p>
  <p data-title="동쪽의 시대, 서쪽에서 살아가기" data-month="11월">‘묻고 더블로 가’라는 노름판의 정신을 부동산으로 실현하는 아현역</p>
  <p data-title="동쪽의 시대, 서쪽에서 살아가기" data-month="11월">동쪽으로 가지 않아도 될 이유를 하나씩 발견하고 있다.</p>
  <p data-title="동쪽의 시대, 서쪽에서 살아가기" data-month="11월">역시나 사람은 적응하며 살아간다.</p>
  <p data-title="시작의 시작의 시작" data-month="11월">모르는 게 되기로 했으니 그게 뭔지부터 알아야 했다.</p>
  <p data-title="시작의 시작의 시작" data-month="11월">그리고 다 읽으시면 꼭 다른 책과 함께 돌려주셨었다.</p>
  <p data-title="시작의 시작의 시작" data-month="11월">네네네! 맞아요.</p>
  <p data-title="시작의 시작의 시작" data-month="11월">자료실에 가서 해외 광고제 수상작들을 비디오테이프에 복사하고, 곧 버려질 이월 잡지들을 들 수 있는 만큼 제일기획 로고가 인쇄된 쇼핑백 가득 채웠다. 메일을 받고 1,2주쯤 지났던가 양손 가득 쇼핑백을 들고 부산으로 달려갔다.</p>
  <p data-title="시작의 시작의 시작" data-month="11월">‘내년에도 또 5월이 온다’고 자랑하고 싶을 만큼.</p>
  <p data-title="나 자신으로 직진하기" data-month="11월">작은 키인데 어딘지 굉장히 단단해 보이는 자세와 아우라.</p>
  <p data-title="나 자신으로 직진하기" data-month="11월">세련된 어른 여자의 그것</p>
  <p data-title="나 자신으로 직진하기" data-month="11월">나는 운동이라는 세계보다는 그로 인해 변해갈 내 인생이 궁금했던 것 같다.</p>
  <p data-title="나 자신으로 직진하기" data-month="11월">내 몸의 가능성보다 정신이 지배하고 있는 내 안의 빈 공간을 감각하게 된다. 몸으로 감각한다는 것은 날것 그대로의 나 자신으로 직진하는 것임을, 투명하게 나를 알아가고 돌아보는 것임을, 체력 증대나 다이어트에 좋다는 가치 너머에 내 척추를 세워주는 것임을 그렇게 깨닫고야 말았다.</p>
  <p data-title="나 자신으로 직진하기" data-month="11월">기개 있고 꼿꼿한 뒷모습</p>
  <p data-title="균형 잡기" data-month="11월">하고 싶은 말을 입에 가득 물었지만 뱉지는 못했다.</p>
  <p data-title="균형 잡기" data-month="11월">나는 인정하는 스스로가 쿨하다고 생각하며 아직 모르겠다고 했는데, 나에겐 헐고 헐어 낡았다고 생각했던 질문이 곱씹을수록 신맛처럼 맴돌았다.</p>
  <p data-title="균형 잡기" data-month="11월">두려움이 배꼽 끝에서 자라나는 것만 같다. 어찌해야 할 바를 모르겠다.</p>
  <p data-title="퇴사를 후회한다" data-month="11월">그렇게 퇴사를 하고 싶었고, 퇴사를 후회하게 될까 봐 그렇게 참고 참다가 드디어 퇴사하고 워홀을 가려고 하는데, 벌써 그 선택을 후회했다고?</p>
  <p data-title="퇴사를 후회한다" data-month="11월">퇴사를 하고 나니, 내 인스타그램의 모든 릴스는 퇴사를 말리는 릴스였다</p>
  <p data-title="퇴사를 후회한다" data-month="11월">퇴사하니 그 순간들이 모두 미화되었다.</p>
  <p data-title="일종의 고백" data-month="11월">이직 여부를 최종 결정하고 나서 얘기해도 됐을 텐데 왜 미리 얘기해서 주말에 이렇게 심란하게 하는가. 자신이 혼자 비밀의 크기를 감당하기 힘들어서 우리에게 일찍 고백함으로써 본인 마음만 편해지려는 것 아닌가. 주말 내내 나는 어떤 경솔함과 무책임에 대한 분노에 휩싸여 괴로워했다.</p>
  <p data-title="일종의 고백" data-month="11월">나는 이제 그녀가 한심해 보인다. 실망하고 또 실망하고 또 실망해서 팀장으로서 일말의 존경심이 들지 않는다. 지난 13년간 회사를 다니면서 내가 팀장이라는 존재에게 ‘존경심’이라는 가치를 두고 있는지 미처 몰랐는데 그녀가 깨닫게 했다.</p>
  <p data-title="일종의 고백" data-month="11월">매일 수련하듯 출근한다.</p>
  <p data-title="택시 타자" data-month="11월">그때 패기 넘치던 김한나는 그게 진짜 그 동네를 알아가는 로컬 여행이라고 믿었거든.</p>
  <p data-title="택시 타자" data-month="11월">그때 시드니에서도 아빠는 매일 아침 누룽지를 챙겨 먹었잖아.</p>
  <p data-title="택시 타자" data-month="11월">그래서 앞으로는 내가 안 겪어본 일은 쉽게 말하지 않기로 했어. 그리고 아빠도 안 해본 일이라고 너무 겁내지 않았으면 좋겠어. 아빠의 삶은 아직 많이 남았으니까,</p>
  <p data-title="택시 타자" data-month="11월">나 같은 딸을 갖고 싶거든.</p>
  <p data-title="노배터리" data-month="11월">문이 열릴 때마다 엘리베이터 안을 살폈지만 익숙한 얼굴은 보이지 않았다.</p>
  <p data-title="노배터리" data-month="11월">커피값 550엔이 아까워서 카페에 들어가지 않았다는 그 말은 차마 할 수 없었다</p>
</template>
<script>
const PROMPTS = [...document.getElementById('prompts').content.querySelectorAll('p')].map(p => ({ title: p.dataset.title, month: p.dataset.month, text: p.textContent }));
const KEY = 'uecl-line-order';

function shuffled(n) {
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// 한 바퀴 돌 때까지 같은 문장이 다시 나오지 않게 순서를 기억한다. 저장이 막혀도 무작위로는 돈다.
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.n === PROMPTS.length && Array.isArray(s.order)) return s;
  } catch (e) {}
  return { n: PROMPTS.length, order: shuffled(PROMPTS.length), pos: 0 };
}
function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }

let state = load();
const $ = id => document.getElementById(id);

const CHO = [...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'];
// 한글은 ㅍ → 펴 → 편 처럼 자판으로 치는 순서대로 보여 준다
function strokes(ch) {
  const c = ch.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return [ch];
  const cho = Math.floor(c / 588), jung = Math.floor((c % 588) / 28);
  const s = [CHO[cho], String.fromCharCode(0xAC00 + cho * 588 + jung * 28)];
  if (c % 28) s.push(ch);
  return s;
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let run = 0, finish = null;

function type(text) {
  const id = ++run, typed = $('typed'), card = $('card');
  $('ghost').textContent = text;
  $('sr').textContent = text;
  const caret = '<span class="caret"></span>';
  const done = () => { if (id !== run) return; typed.innerHTML = ''; typed.append(text); typed.insertAdjacentHTML('beforeend', caret); card.classList.remove('typing'); finish = null; };
  if (reduce) return done();
  card.classList.add('typing');
  finish = done;
  const chars = [...text];
  let i = 0, k = 0, before = '';
  (function tick() {
    if (id !== run || !finish) return;
    if (i >= chars.length) return done();
    const st = strokes(chars[i]);
    typed.textContent = before + st[k];
    typed.insertAdjacentHTML('beforeend', caret);
    let wait = 34 + Math.random() * 40;
    if (++k >= st.length) {
      before += chars[i]; k = 0;
      if (/[.,!?…]/.test(chars[i])) wait += 260;
      else if (chars[i] === ' ') wait += 30;
      i++;
    }
    setTimeout(tick, wait);
  })();
}

function show() {
  if (state.pos >= state.order.length) state = { n: PROMPTS.length, order: shuffled(PROMPTS.length), pos: 0 };
  const { title, month, text } = PROMPTS[state.order[state.pos]];
  $('card').className = 'card line' + (text.length > 90 ? ' long' : '');
  $('kind').textContent = '멤버들이 공감한 문장';
  type(text);
  $('src').textContent = `${month} 「${title}」에서`;
  $('count').textContent = `${state.pos + 1} / ${PROMPTS.length}`;
  state.pos++;
  save(state);
}

$('text').addEventListener('click', () => finish && finish());
$('next').addEventListener('click', () => {
  $('card').classList.add('fade');
  setTimeout(() => { show(); $('card').classList.remove('fade'); }, 200);
});
show();
</script>
</body>
</html>
